spring.application.name=challenge

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/main-changelog.xml

api.security.token.secret=U0PFWkG9ab0EJOT147BSYYLVsrlgoMcFUjkzIWvS
server.servlet.context-path=/api

# swagger
springdoc.api-docs.path=/documentation

#para as probes
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,liveness,readiness, prometheus
management.endpoint.health.show-details=always
server.port=8080

# Datadog Tracing
dd.trace.enabled=true
dd.service=challengeone
dd.trace.http.client.tag.query-string=true
dd.trace.jdbc.enabled=true
dd.trace.jdbc.query-size=5000
dd.trace.logs.injection=true

dd.trace.sample.rate=1.0
dd.env=${DD_ENV:dev}
dd.version=${DD_VERSION:1.0.0}
dd.trace.agent.host=${DD_AGENT_HOST:localhost}
dd.trace.agent.port=${DD_AGENT_PORT:8126}
dd.trace.debug=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.fiap=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

jwt.secret=ZHVtbXktc2VjcmV0LWtleS1mb3Itand0LWhzMjU2LXN1cGVyLXNlY3VyZQ==

aws.sqs.queue.payment-failure=payment-response-failure-queue
aws.sqs.queue.payment-request=payment-request-queue
aws.sqs.queue.payment-success=payment-response-success-queue
aws.sqs.queue.stock-approved=work-order-stock-approved
aws.sqs.queue.stock-cancel=work-order-stock-cancel-requested
aws.sqs.queue.stock-failed=stock-failed-queue
aws.sqs.queue.stock-request=work-order-stock-requested
aws.sqs.queue.stock-reserved=stock-reserved-queue
